version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: koordination-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: koordination
      POSTGRES_PASSWORD: koordination_secret
      POSTGRES_DB: koordination
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U koordination"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: koordination-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://koordination:koordination_secret@postgres:5432/koordination
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production}
      PORT: 3001
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
      - /app/dist

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: koordination-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-http://localhost:3001}
      NEXT_PUBLIC_VERSION: "1.0"
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
